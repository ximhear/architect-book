name: 베타 리뷰 피드백
description: 1차 드래프트 회람에 대한 외부 리뷰어 피드백
title: "[베타 피드백] <분야> — <간단 요약>"
labels: ["beta-review"]
body:
  - type: markdown
    attributes:
      value: |
        대한민국 서비스 아키텍트 입문서 베타 리뷰에 참여해 주셔서 감사합니다.
        먼저 [`review/reviewer-pack.md`](../../blob/main/review/reviewer-pack.md) 를 읽어 주세요.

  - type: input
    id: reviewer
    attributes:
      label: 본인 이름 / 닉네임
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 검토 분야
      options:
        - 보안 / 컴플라이언스
        - 인프라 / SRE
        - 백엔드
        - 프론트엔드
        - 데이터 / ML
        - 타깃 독자 (시니어 → 아키텍트 전환자)
        - 기타
    validations:
      required: true

  - type: checkboxes
    id: files
    attributes:
      label: 검토한 파일
      options:
        - label: case-study/README.md
        - label: 00-들어가며/
        - label: 01-아키텍처-기초/
        - label: 08-종합-케이스-스터디/
        - label: 분야 챕터 (제목은 본문에 명시)
        - label: 메타 ADR
    validations:
      required: true

  - type: textarea
    id: facts
    attributes:
      label: A. 사실 / 정확성
      description: |
        법규·인증 시점, 수치·통계 출처, 국내 환경 반영도 관련 발견.
        형식: `위치 (파일:절) — 발견 — 제안`
      placeholder: |
        - 06장 1.4 — "사고 통지 24시간" 이 현행 법규와 다름 — 「개인정보 보호법」 제34조 시행령 기준 명시
    validations:
      required: false

  - type: textarea
    id: tradeoffs
    attributes:
      label: B. 트레이드오프 / 균형
      description: AWS-only 단정, 한쪽으로 기운 결정, 다른 환경 적용 가능성
    validations:
      required: false

  - type: textarea
    id: case_consistency
    attributes:
      label: C. 케이스 일관성
      description: 챕터마다 원픽의 모습이 다른 지점, 케이스 스터디와 어긋나는 결정
    validations:
      required: false

  - type: textarea
    id: reader_view
    attributes:
      label: D. 독자 입장
      description: 너무 추상 / 너무 세부 / 누락 / 사족
    validations:
      required: false

  - type: textarea
    id: praise
    attributes:
      label: 잘 된 점 (3개 이내)
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: 종합 한 단락
      description: |
        - 이 책이 출간될 만한가?
        - 어떤 독자에게 가장 권하시겠는가?
        - 출간 전 반드시 손봐야 할 한 가지는?
    validations:
      required: true

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Pretendard', 'Noto Sans KR', sans-serif">
  <!--
    망분리 3종 비교 — 6장 4.3 보강.
    인터넷망 / 업무망 / DB망 — 가로 3 영역. 사이에 통제(방화벽 / DLP / 점프 호스트).
  -->

  <defs>
    <style>
      .zone { stroke-width: 2; fill-opacity: 0.15; }
      .zone-label { font-size: 16px; font-weight: 700; }
      .control { fill: #ffe8c2; stroke: #d4a017; stroke-width: 1.5; }
      .control-text { font-size: 12px; text-anchor: middle; font-weight: 600; }
      .item { fill: #fff; stroke: #444; stroke-width: 1.2; }
      .item-text { font-size: 12px; text-anchor: middle; }
      .title { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .caption { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <text x="450" y="32" class="title">망분리 3종 — 인터넷망 · 업무망 · DB망</text>

  <!-- 인터넷망 (왼쪽) -->
  <rect x="30" y="80" width="240" height="340" rx="8" class="zone" fill="#4a90e2" stroke="#4a90e2"/>
  <text x="50" y="105" class="zone-label" fill="#1a4a82">① 인터넷망</text>
  <text x="50" y="122" class="caption">외부 사용자 트래픽</text>

  <rect x="60" y="160" width="180" height="34" rx="4" class="item"/>
  <text x="150" y="181" class="item-text">사용자 (모바일·웹)</text>

  <rect x="60" y="210" width="180" height="34" rx="4" class="item"/>
  <text x="150" y="231" class="item-text">CDN / WAF</text>

  <rect x="60" y="260" width="180" height="34" rx="4" class="item"/>
  <text x="150" y="281" class="item-text">Bot 방어 / DDoS 방어</text>

  <rect x="60" y="310" width="180" height="34" rx="4" class="item"/>
  <text x="150" y="331" class="item-text">로드밸런서 / Ingress</text>

  <!-- 통제 1 (인터넷 ↔ 업무) -->
  <rect x="280" y="200" width="60" height="100" rx="6" class="control"/>
  <text x="310" y="225" class="control-text">방화벽</text>
  <text x="310" y="245" class="control-text" font-size="10" font-weight="400">+</text>
  <text x="310" y="265" class="control-text" font-size="11">접근</text>
  <text x="310" y="280" class="control-text" font-size="11">화이트리스트</text>

  <!-- 업무망 (가운데) -->
  <rect x="350" y="80" width="240" height="340" rx="8" class="zone" fill="#4ae274" stroke="#3a9a5a"/>
  <text x="370" y="105" class="zone-label" fill="#1a5a2a">② 업무망</text>
  <text x="370" y="122" class="caption">직원 PC · 사내 시스템</text>

  <rect x="380" y="160" width="180" height="34" rx="4" class="item"/>
  <text x="470" y="181" class="item-text">직원 노트북</text>

  <rect x="380" y="210" width="180" height="34" rx="4" class="item"/>
  <text x="470" y="231" class="item-text">VPN + MFA</text>

  <rect x="380" y="260" width="180" height="34" rx="4" class="item"/>
  <text x="470" y="281" class="item-text">EDR (엔드포인트 탐지)</text>

  <rect x="380" y="310" width="180" height="34" rx="4" class="item"/>
  <text x="470" y="331" class="item-text">DLP (정보 유출 방지)</text>

  <!-- 통제 2 (업무 ↔ DB) -->
  <rect x="600" y="200" width="60" height="100" rx="6" class="control"/>
  <text x="630" y="225" class="control-text">점프</text>
  <text x="630" y="245" class="control-text">호스트</text>
  <text x="630" y="265" class="control-text" font-size="11">+</text>
  <text x="630" y="280" class="control-text" font-size="11">작업 녹화</text>

  <!-- DB망 (오른쪽) -->
  <rect x="670" y="80" width="200" height="340" rx="8" class="zone" fill="#e2574a" stroke="#82231a"/>
  <text x="690" y="105" class="zone-label" fill="#82231a">③ DB · 운영망</text>
  <text x="690" y="122" class="caption">운영 DB · 결제 시스템</text>

  <rect x="700" y="160" width="150" height="34" rx="4" class="item"/>
  <text x="775" y="181" class="item-text">운영 DB (Aurora)</text>

  <rect x="700" y="210" width="150" height="34" rx="4" class="item"/>
  <text x="775" y="231" class="item-text">결제 시스템</text>

  <rect x="700" y="260" width="150" height="34" rx="4" class="item"/>
  <text x="775" y="281" class="item-text">감사 로그 / SIEM</text>

  <rect x="700" y="310" width="150" height="34" rx="4" class="item"/>
  <text x="775" y="331" class="item-text">암호키 (HSM / KMS)</text>

  <!-- 흐름 화살표 -->
  <line x1="240" y1="280" x2="290" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="280" x2="610" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 하단 콜아웃 -->
  <text x="20" y="455" font-size="12" fill="#555">
    공공 · 금융 — <tspan font-weight="700">물리 분리</tspan> 의무 (별도 IDC + 점프 호스트 + DLP).
    일반 IT 서비스 — <tspan font-weight="700">논리 분리</tspan> (VPC 분리 + Private Link) 가 일반적.
  </text>
</svg>
